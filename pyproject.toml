[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "vibegit"
description = "Turn a busy Git working tree into focused, reviewable commits with AI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dynamic = ["version"]
keywords = ["git", "commit", "ai", "llm", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/kklemon/vibegit"
Repository = "https://github.com/kklemon/vibegit"

[tool.maturin]
# Ship the Rust binary as a console script; no Python module is involved.
bindings = "bin"
strip = true
