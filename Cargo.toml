[package]
name = "vibegit"
version = "0.3.0"
edition = "2021"
description = "Turn a busy Git working tree into focused, reviewable commits with AI."
license = "MIT"
readme = "README.md"
repository = "https://github.com/kklemon/vibegit"
keywords = ["git", "commit", "ai", "llm", "tui"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.80"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.28"
genai = { version = "0.6.5", default-features = false, features = ["rustls-tls"] }
ratatui = "0.29"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
toml = "1.1.8"
tui-textarea = "0.7"
unicode-width = "0.2.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
